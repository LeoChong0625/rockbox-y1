name: Build Rockbox for V60
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texinfo flex bison build-essential libncurses5-dev zip libsdl1.2-dev

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r15c-linux-x86_64.zip
          unzip -q android-ndk-r15c-linux-x86_64.zip
          echo "ANDROID_NDK_PATH=$GITHUB_WORKSPACE/android-ndk-r15c" >> $GITHUB_ENV

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          ../tools/configure --target=android --resolution=360x640 --type=normal
          make -j$(nproc)
          make zip
          make apk

      - name: Upload APK and Data
        uses: actions/upload-artifact@v4
        with:
          name: Rockbox_V60_Build
          path: |
            build/*.apk
            build/*.zip
